<svg width="880" height="300" viewBox="0 0 880 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    text {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace;
    }
    .line {
      opacity: 0;
      animation: fadeIn 0.45s ease forwards;
    }
    .l1 { animation-delay: 0.4s; }
    .l2 { animation-delay: 1.0s; }
    .l3 { animation-delay: 1.8s; }
    .l4 { animation-delay: 2.4s; }
    .l5 { animation-delay: 3.2s; }
    .cursor {
      opacity: 0;
      animation: fadeIn 0.1s ease 3.4s forwards, blink 1.1s steps(1) 3.5s infinite;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>

  <!-- terminal window -->
  <rect x="1" y="1" width="878" height="298" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- title bar -->
  <rect x="2" y="2" width="876" height="48" rx="15" fill="#161b22"/>
  <rect x="2" y="36" width="876" height="14" fill="#161b22"/>
  <line x1="2" y1="50" x2="878" y2="50" stroke="#30363d" stroke-width="1"/>
  <circle cx="30" cy="26" r="7" fill="#ff5f56"/>
  <circle cx="54" cy="26" r="7" fill="#ffbd2e"/>
  <circle cx="78" cy="26" r="7" fill="#27c93f"/>
  <text x="440" y="31" fill="#8b949e" font-size="13" text-anchor="middle">daehyeon@zighang: ~/profile</text>

  <!-- $ whoami -->
  <text class="line l1" x="36" y="98" font-size="17">
    <tspan fill="#7ee787" font-weight="700">&#10148;</tspan>
    <tspan fill="#79c0ff" dx="6">~</tspan>
    <tspan fill="#e6edf3" dx="10">whoami</tspan>
  </text>

  <!-- name -->
  <text class="line l2" x="36" y="145" font-size="34" font-weight="800" fill="#e6edf3">Daehyeon Son
    <tspan fill="#8b7cf6">_</tspan>
  </text>

  <!-- $ cat role.txt -->
  <text class="line l3" x="36" y="192" font-size="17">
    <tspan fill="#7ee787" font-weight="700">&#10148;</tspan>
    <tspan fill="#79c0ff" dx="6">~</tspan>
    <tspan fill="#e6edf3" dx="10">cat role.txt</tspan>
  </text>

  <!-- role -->
  <text class="line l4" x="36" y="226" font-size="18">
    <tspan fill="#bf91f3" font-weight="700">Product Owner @ Zighang</tspan>
    <tspan fill="#484f58" dx="10">|</tspan>
    <tspan fill="#8b949e" dx="10">Backend &#183; Infra &#183; Product</tspan>
  </text>

  <!-- prompt + blinking cursor -->
  <text class="line l5" x="36" y="268" font-size="17">
    <tspan fill="#7ee787" font-weight="700">&#10148;</tspan>
    <tspan fill="#79c0ff" dx="6">~</tspan>
  </text>
  <rect class="cursor" x="86" y="253" width="10" height="19" fill="#e6edf3"/>
</svg>
