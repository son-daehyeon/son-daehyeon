<svg width="880" height="420" viewBox="0 0 880 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    text {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace;
      white-space: pre;
    }
    .line {
      opacity: 0;
      animation: fadeIn 0.4s ease forwards;
    }
    .d0 { animation-delay: 0.3s; }
    .d1 { animation-delay: 0.7s; }
    .d2 { animation-delay: 0.85s; }
    .d3 { animation-delay: 1.0s; }
    .d4 { animation-delay: 1.15s; }
    .d5 { animation-delay: 1.3s; }
    .d6 { animation-delay: 1.45s; }
    .d7 { animation-delay: 1.6s; }
    .d8 { animation-delay: 1.75s; }
    .d9 { animation-delay: 1.9s; }
    .d10 { animation-delay: 2.05s; }
    .d11 { animation-delay: 2.2s; }
    .d12 { animation-delay: 2.5s; }
    .cursor {
      opacity: 0;
      animation: fadeIn 0.1s ease 2.7s forwards, blink 1.1s steps(1) 2.8s infinite;
    }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

