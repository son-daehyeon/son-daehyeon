name: Update profile assets

on:
  schedule:
    - cron: "0 * * * *" # 매시 정각
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gitlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate git log cards
        env:
          # GH_PAT(repo 스코프)가 있어야 private 커밋이 블러 라인으로 포함된다.
          # 없으면 기본 토큰으로 동작하되 public 커밋만 노출된다.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_gitlog.py

      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/gitlog-*.svg
          git diff --cached --quiet || git commit -m "chore: update git log cards"
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: son-daehyeon
          outputs: |
            dist/snake-dark.svg?color_snake=%238b7cf6&color_dots=%23161b22,%230e4429,%23006d32,%2326a641,%2339d353
            dist/snake-light.svg?color_snake=%238250df&color_dots=%23ebedf0,%239be9a8,%2340c463,%2330a14e,%23216e39

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
