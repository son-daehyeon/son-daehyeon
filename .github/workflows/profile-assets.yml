name: Update profile assets

on:
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gitlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate git log cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_gitlog.py

      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/gitlog-*.svg
          git diff --cached --quiet || git commit -m "chore: update git log cards"
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: son-daehyeon
          outputs: |
            dist/snake-dark.svg?color_snake=#7ee787&color_dots=#21262d,#4c3d8f,#6b5bc4,#8b7cf6,#bf91f3
            dist/snake-light.svg?color_snake=#1a7f37&color_dots=#eff2f5,#d8c9f7,#b39ae8,#8957e5,#6639ba

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
